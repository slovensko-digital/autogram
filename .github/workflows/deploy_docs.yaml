name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy_docs.yaml'
  release:
    # marking a published release as the latest is an edit
    types: [released, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # a release run would check out the tag, but the edge version is always main
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Extract the releases
        # the published site lists the releases that have been the latest, a release deleted on GitHub is left out
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          status=$(curl -sSL -o "$RUNNER_TEMP/releases.json" -w '%{http_code}' "$SITE_URL/releases.json?$(date +%s)")
          case "$status" in
            200) published=$(jq -r '.[]' "$RUNNER_TEMP/releases.json") ;;
            404) published= ;;
            *) echo "::error::$SITE_URL/releases.json returned HTTP $status"; exit 1 ;;
          esac
          older=$(comm -12 <(sort <<<"$published") <(sort <<<"$existing") | grep -vxF "$latest" | sort -rV || true)
          releases=$(printf '%s\n' "$latest" $older | paste -sd, -)
          for tag in ${releases//,/ }; do
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          done
          bash scripts/prepare-releases.sh ${releases//,/ }
          echo "DOCS_RELEASES=$releases" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build
        env:
          DOCMD_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Validate docs
        run: npm run validate

      - name: Check images
        run: npm run check-images

      - name: Record the releases
        run: jq -n --arg releases "$DOCS_RELEASES" '$releases | split(",")' > dist/releases.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
