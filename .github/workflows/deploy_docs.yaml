name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy_docs.yaml'
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # a release run would check out the tag, but the edge version is always main
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      - name: Extract the latest release
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          if ! git cat-file -e "$tag:./docs" 2>/dev/null; then
            echo "::notice::$tag has no docmd guides, building only main"
            exit 0
          fi
          bash scripts/prepare-latest.sh "$tag"
          echo "DOCS_LATEST_RELEASE=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build
        env:
          DOCMD_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Validate docs
        run: npm run validate

      - name: Check images
        run: npm run check-images

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
