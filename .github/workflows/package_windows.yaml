name: Windows Packaging

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - "dev-build"
      version:
        required: true
        type: choice
        options:
          - "1.0.0"

jobs:
  package:
    environment: ${{ inputs.environment }}
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Update version in pom
        run: ./mvnw versions:set -DnewVersion=${VERSION}
        shell: bash

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "25.0.4+9"
          distribution: "liberica"
          java-package: "jdk+fx"

      - name: Cache local Maven repository and JDK cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            target/jdkCache
          key: windows-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            windows-maven-

      - name: Install AzureSignTool
        if: ${{ inputs.environment == 'packaging' && startsWith(github.ref, 'refs/tags/') }}
        run: dotnet tool install --global AzureSignTool

      - name: Package with Maven
        run: ./mvnw -B -C -V package
        env:
          # MSIX for Microsoft Store is built in package_windows_store.yaml
          WINDOWS_PACKAGE_TYPES: msi
          # Executables are signed only when AzureSignTool is installed (packaging)
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}

      - name: Rename artifacts
        shell: bash
        run: |
          mv target/Autogram-*.msi target/autogram-${VERSION}-windows.msi

      - name: Sign on Azure
        if: ${{ inputs.environment == 'packaging' && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          AzureSignTool sign --description "Autogram" -kvu "${{ secrets.AZURE_KEY_VAULT_URI }}" -kvi "${{ secrets.AZURE_CLIENT_ID }}" -kvt "${{ secrets.AZURE_TENANT_ID }}" -kvs "${{ secrets.AZURE_CLIENT_SECRET }}" -kvc ${{ secrets.AZURE_CERT_NAME }} -tr http://timestamp.digicert.com -v target/autogram-${VERSION}-windows.msi

      - name: Upload artifact
        if: ${{ inputs.environment == 'dev-build' }}
        uses: actions/upload-artifact@v6
        with:
          name: autogram-${{ inputs.version }}-windows.msi
          path: target/autogram-${{ inputs.version }}-windows.msi
          if-no-files-found: ignore

      - name: Create release if tag pushed
        if: ${{ inputs.environment == 'packaging' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          draft: true
          prerelease: true
          files: |
            target/autogram-${{ inputs.version }}-windows.msi
