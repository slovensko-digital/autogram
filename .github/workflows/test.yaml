name: Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      app: ${{ steps.files.outputs.app }}

    steps:
      - name: Check if the pull request changes the app
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, .previous_filename // empty')
          app=false
          while IFS= read -r file; do
            case "$file" in
              docs/* | assets/* | packaging/* | .idea/* | .vscode/* | .run/*) ;;
              .github/ISSUE_TEMPLATE/* | .github/CODEOWNERS | .github/dependabot.yml) ;;
              .github/workflows/package_*.yaml | .github/workflows/release.yaml | .github/workflows/prerelease.yaml) ;;
              .github/workflows/deploy_docs.yaml | .github/workflows/pr_title.yaml) ;;
              */*) app=true ;;
              *.md | LICENSE | docker-compose.yml | .gitignore | .dockerignore | .project | .classpath) ;;
              release-please-config.json | .release-please-manifest.json) ;;
              *) app=true ;;
            esac
          done <<< "$files"
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ${{ matrix.config.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        config:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '25.0.4+9'
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Cache local Maven repository and JDK cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            target/jdkCache
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw test -P system-jdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the check required for merging, the test jobs are skipped when only the docs or other files outside the app change
  test-result:
    if: ${{ always() }}
    needs:
      - changes
      - test
    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST"
          [ "$CHANGES" = success ] && [[ "$TEST" =~ ^(success|skipped)$ ]]
