name: Linux Arch Packaging

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - "dev-build"
      version:
        required: true
        type: choice
        options:
          - "1.0.0"

jobs:
  package:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    container: "archlinux:latest"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Setup dependencies
        run: |
          # JavaFX in the tests needs fonts, the JDK from the archive brings no system packages with it
          pacman -Syu --noconfirm --needed base-devel git wget pacman-contrib fontconfig freetype2 ttf-dejavu
          wget https://download.bell-sw.com/java/25.0.4+9/bellsoft-jdk25.0.4+9-linux-amd64-full.tar.gz
          mkdir -p /usr/lib/jvm
          tar -xzf bellsoft-jdk25.0.4+9-linux-amd64-full.tar.gz -C /usr/lib/jvm
          mv /usr/lib/jvm/jdk-25.0.4-full /usr/lib/jvm/bellsoft-java25-full-amd64

      - uses: actions/checkout@v4

      - name: Build artifact
        run: |
          export JAVA_HOME=/usr/lib/jvm/bellsoft-java25-full-amd64
          export PATH=$JAVA_HOME/bin:$PATH

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ./mvnw versions:set -DnewVersion="${VERSION}"

          ./mvnw -B -C -V package -P system-jdk
          ls -lah ./target

      # The AUR package is published from the release (publish_aur.yaml), here it is only built and installed from
      # the artifact to check that the PKGBUILD works with it
      - name: Build and install the AUR package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir /home/builder/aur
          cp packaging/arch/* "target/autogram-${VERSION}-arch.tar.gz" /home/builder/aur/
          chown -R builder /home/builder/aur

          cd /home/builder/aur
          sudo -u builder sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder makepkg --syncdeps --force --noconfirm
          pacman -U --noconfirm autogram-bin-*.pkg.tar.zst
          test "$(autogram --version)" = "${VERSION}"
          # the update window tells AUR users to update with their package manager
          grep -qx "java-options=-Dautogram.updateChannel=aur" /opt/autogram/lib/app/autogram.cfg

          cp autogram-bin-*.pkg.tar.zst "${GITHUB_WORKSPACE}/target/"

      - name: Upload artifact
        if: ${{ inputs.environment == 'dev-build' }}
        uses: actions/upload-artifact@v6
        with:
          name: autogram-${{ inputs.version }}-arch
          path: |
            target/autogram-${{ inputs.version }}-arch.tar.gz
            target/autogram-bin-*.pkg.tar.zst
          if-no-files-found: ignore

      - name: Create release if tag pushed
        if: ${{ inputs.environment == 'packaging' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          draft: true
          prerelease: true
          files: |
            target/autogram-${{ inputs.version }}-arch.tar.gz
